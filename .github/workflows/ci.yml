name: VESLocal CI Pipeline

on:
  push:
    branches: [ main, 'recovery/**' ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend Build & Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Build Frontend Production Assets
        run: npm run build

  backend:
    name: Backend Test Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Integration & Unit Tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret_key_veslocal_2026
