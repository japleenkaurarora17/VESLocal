services:
  # Backend REST API & WebSocket Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veslocal-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI must be provided}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in environment}
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - veslocal-network

  # Frontend React SPA served with Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: veslocal-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - veslocal-network

networks:
  veslocal-network:
    driver: bridge
